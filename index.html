<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>Attack 2.0 &mdash; Underwater Battle</title>
  </head>
  <body>
    <canvas id="canvas1"></canvas>

    <!--Characters-->
    <img src="assets/player.png" id="player" alt="" />
    <img src="assets/playerTouched.png" id="playerTouched" alt="" />

    <img src="assets/angler1.png" id="angler1" />
    <img src="assets/angler2.png" id="angler2" />
    <img src="assets/lucky.png" id="lucky" />
    <img src="assets/hivewhale.png" id="hivewhale" />
    <img src="assets/drone.png" id="drone" />
    <img src="assets/dragonSprite.png" id="dragonSprite" />

    <!--props-->
    <img src="assets/projectile.png" id="projectile" alt="" />
    <img src="assets/gears.png" id="gears" alt="" />
    <img src="assets/smokeExplosion.png" id="smokeExplosion" alt="" />
    <img src="assets/fireExplosion.png" id="fireExplosion" alt="" />
    <img src="assets/backUpImg.png" id="backUpImg" />

    <!--environment-->
    <img src="assets/layer1.png" id="layer1" alt="" />
    <img src="assets/layer2.png" id="layer2" alt="" />
    <img src="assets/layer3.png" id="layer3" alt="" />
    <img src="assets/layer4.png" id="layer4" alt="" />
    <img src="assets/layer5.png" id="layer5" alt="" />

    <!--control pannel for mobile version-->
    <div id="control_block">
      <div id="directional_buttons">
        <div id="up">
          <div class="arrow_symbol">&uarr;</div>
        </div>
        <div id="down">
          <div class="arrow_symbol">&darr;</div>
        </div>
      </div>
      <div id="shoot">FIRE</div>
    </div>

    <!--intro screen-->
    <div id="intro_screen">
      <div id="bubbles" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>
      <div id="intro_panel">
        <p id="intro_kicker">Deep Sea Combat</p>
        <h1 id="intro_title">Attack <span>2.0</span></h1>
        <p id="intro_tagline">
          Hunt the swarm, ride the power-ups and summon your dragon.<br />
          Score 1000 before the 100 seconds run dry.
        </p>
        <div id="intro_ship" aria-hidden="true"></div>
        <button id="play_now" type="button">Play Now</button>
        <ul id="intro_controls">
          <li><span class="key">&uarr;</span><span class="key">&darr;</span> Move</li>
          <li><span class="key">Space</span> Shoot</li>
          <li><span class="key">D</span> Debug</li>
        </ul>
      </div>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
